# IAS MQTT broker configuration
# Devices publish on  ias/<COMPANY_CODE>/<DEVICE_ID>/{telemetry,snapshot,status}
# The web service publishes downlinks on ias/<COMPANY_CODE>/<DEVICE_ID>/cmd

per_listener_settings false

# Native MQTT - used by the devices, the web service and the simulator.
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets - lets the browser subscribe directly with mqtt.js.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

max_inflight_messages 100
max_queued_messages 5000
# Snapshots are base64 frames, so allow a comfortable payload ceiling.
message_size_limit 10485760

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
